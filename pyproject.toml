[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akash-flood"
version = "0.1.0"
description = "Reproducible satellite flood evidence and road-access analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "rasterio>=1.4,<2",
  "shapely>=2,<3",
  "pyproj>=3.6,<4",
  "networkx>=3.4,<4",
  "requests>=2.32,<3",
  "folium>=0.19,<1",
]

[project.scripts]
akash-flood = "akash_flood.cli:main"

[project.optional-dependencies]
satellite = [
    "openeo>=0.48,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

