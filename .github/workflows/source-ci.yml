name: Source and saved-evidence checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install exact dependency manager
        run: python -m pip install uv==0.13.0
      - name: Install locked base dependencies
        run: uv sync --frozen
      - name: Test source including optional model loader
        run: uv run --with scikit-learn==1.7.2 python -m pytest -q
      - name: Run network-prohibited synthetic graph smoke
        run: uv run --no-sync python release/smoke_source.py --out output/ci-synthetic-smoke
      - name: Check saved website source bindings and local links
        run: python scripts/verify_public_site_20261013.py
